# twrp_devices.conf - the phones this TWRP knows, one row each.
#
# codename|model|touch modules
#
# codename       androidboot.hardware from the bootloader (ro.boot.hardware) -
#                in recovery ro.product.device is always the build's "shiba".
# model          shown on the main page's slot chip and on the splash.
# touch modules  added to TW_LOAD_VENDOR_MODULES by TWRP's module loader (from
#                the slot's vendor_dlkm) and loaded in this order by
#                twrp_touch_fallback.sh (from system/etc/touch_fallback/);
#                every module except heatmap and goog_touch_interface (the
#                shared helpers, listed first) is a touchscreen driver - one
#                per panel (the 9 Pro Fold has two).
#
# Read by TWRP (twrp-functions.cpp Device_Info), twrp_touch_fallback.sh and the
# theme build (mktheme.py / mkimages.py draw one slot chip and splash line per
# row). A row here doesn't make a device supported: the installers have their
# own list of tested devices.
#
# #platform|<platform>|<codenames> - which SoC's touch sets a phone uses
# (system/etc/touch_fallback/<platform>/): Google builds each SoC's vendor_dlkm
# separately, so a Pixel 9 needs zumapro's drivers even where a set has the
# same name as a zuma one. Every row is in exactly one of these lines (build.sh
# gate). Not a 4th column: TWRP's Device_Info takes rows of exactly 3 fields,
# and it skips these lines like any comment. Not ro.board.platform either:
# that is "zuma" on every phone (our own prop.default).
#platform|zuma|shiba husky akita
#platform|zumapro|tokay caiman komodo comet tegu
shiba|Pixel 8|heatmap.ko goog_touch_interface.ko goodix_brl_touch.ko
husky|Pixel 8 Pro|heatmap.ko goog_touch_interface.ko ftm5.ko
akita|Pixel 8a|heatmap.ko goog_touch_interface.ko goodix_brl_touch.ko
tokay|Pixel 9|heatmap.ko goog_touch_interface.ko syna_touch.ko
caiman|Pixel 9 Pro|heatmap.ko goog_touch_interface.ko syna_touch.ko
komodo|Pixel 9 Pro XL|heatmap.ko goog_touch_interface.ko syna_touch.ko
comet|Pixel 9 Pro Fold|heatmap.ko goog_touch_interface.ko goodix_brl_touch.ko syna_touch.ko
tegu|Pixel 9a|heatmap.ko goog_touch_interface.ko syna_touch.ko
